<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>MEEVO</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0B0A14;-webkit-app-region:drag;user-select:none}#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 42%,#1d1638 0%,#0B0A14 62%);transition:opacity .32s ease,transform .32s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .sp-logo{position:relative;width:132px;height:88px;animation:spPop .5s cubic-bezier(.3,1.6,.5,1) 1s both,spFloat 2.4s ease-in-out 1.6s infinite}
#splash svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 22px rgba(124,58,237,.45))}
#splash .sp-m{stroke-dasharray:0 100;animation:spWorm 1.05s cubic-bezier(.55,.05,.35,1) .05s forwards}
#splash .sp-ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:3px solid #8B5CF6;box-shadow:0 0 24px #38BDF8,inset 0 0 18px rgba(56,189,248,.5);opacity:0;transform:scale(.3);animation:spRing .6s ease-out 1s forwards}
#splash .sp-drop{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:linear-gradient(#A78BFA,#38BDF8);opacity:0;animation:spDrop .6s ease-out 1.02s forwards}
#splash .sp-word{display:flex;gap:.14em;font:800 30px/1 Inter,'Segoe UI',system-ui,sans-serif;letter-spacing:.06em;color:#F4F1FF}
#splash .sp-word span{opacity:0;transform:translateY(12px) scale(.6);animation:spLetter .42s cubic-bezier(.3,1.5,.5,1) forwards}
#splash .sp-dots{display:flex;gap:6px;height:6px;opacity:0;animation:spFade .4s ease 1.7s forwards}
#splash .sp-dots i{width:6px;height:6px;border-radius:50%;background:#8B5CF6;animation:spDot 1s ease-in-out infinite}
#splash .sp-dots i:nth-child(2){animation-delay:.15s;background:#7C9BF6}#splash .sp-dots i:nth-child(3){animation-delay:.3s;background:#38BDF8}
@keyframes spWorm{0%{stroke-dasharray:0 100;stroke-dashoffset:0}45%{stroke-dasharray:24 100;stroke-dashoffset:-48}62%{stroke-dasharray:24 100;stroke-dashoffset:-76}100%{stroke-dasharray:100 0;stroke-dashoffset:0}}
@keyframes spPop{0%{transform:scale(1)}35%{transform:scale(1.18,.86)}65%{transform:scale(.94,1.06)}100%{transform:scale(1)}}
@keyframes spFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes spRing{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.35)}}
@keyframes spDrop{0%{opacity:1;transform:rotate(var(--a)) translateX(20px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(96px) scale(.3)}}
@keyframes spLetter{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spDot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important;stroke-dasharray:none!important}#splash .sp-ring,#splash .sp-drop{display:none}}</style></head>
<body>
<div id="splash" aria-label="Abrindo o MEEVO" role="status">
  <div class="sp-logo">
    <div class="sp-ring"></div>
    <i class="sp-drop" style="--a:0deg"></i><i class="sp-drop" style="--a:60deg"></i><i class="sp-drop" style="--a:120deg"></i><i class="sp-drop" style="--a:180deg"></i><i class="sp-drop" style="--a:240deg"></i><i class="sp-drop" style="--a:300deg"></i>
    <svg viewBox="0 0 120 80" aria-hidden="true"><defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="0.35"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#38BDF8"/></linearGradient><linearGradient id="sph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path class="sp-m" pathLength="100" d="M12 60 C24 60 25 18 40 18 C53 18 49 49 60 49 C71 49 67 18 80 18 C95 18 96 60 108 60" stroke="url(#spg)" stroke-width="15"/><path class="sp-m" pathLength="100" d="M12 60 C24 60 25 18 40 18 C53 18 49 49 60 49 C71 49 67 18 80 18 C95 18 96 60 108 60" stroke="url(#sph)" stroke-width="6" transform="translate(0 -3.2)"/></g></svg>
  </div>
  <div class="sp-word" aria-hidden="true"><span style="animation-delay:1.08s">M</span><span style="animation-delay:1.14s">E</span><span style="animation-delay:1.2s">E</span><span style="animation-delay:1.26s">V</span><span style="animation-delay:1.32s">O</span></div>
  <div class="sp-dots"><i></i><i></i><i></i></div>
</div>
</body></html>
