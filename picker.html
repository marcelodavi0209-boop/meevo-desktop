<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Transmitir tela - MEEVO</title>
<style>
  :root { --bg:#12101E; --panel:#19152B; --panel2:#211C38; --purple:#7C3AED; --purple2:#8B5CF6; --text:#F4F1FF; --muted:#A7A1BA; --line:rgba(139,92,246,.18); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; user-select: none; }
  header { padding: 20px 24px 0; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  .tabs { display: flex; gap: 6px; padding: 16px 24px 12px; }
  .tabs button { font: inherit; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  .tabs button.sel { background: var(--purple); border-color: var(--purple); color: #fff; }
  .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 4px 24px 16px; align-content: start; }
  .src { background: var(--panel); border: 2px solid transparent; border-radius: 14px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; transition: border-color .15s, transform .15s; }
  .src:hover { border-color: rgba(139,92,246,.5); transform: translateY(-2px); }
  .src.sel { border-color: var(--purple2); box-shadow: 0 0 0 3px rgba(139,92,246,.25); }
  .thumb { aspect-ratio: 16/9; width: 100%; border-radius: 9px; background: #07060D center/contain no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .name { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; font-weight: 600; overflow: hidden; }
  .name img { width: 16px; height: 16px; flex-shrink: 0; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-top: 1px solid var(--line); background: #0E0C19; }
  label.audio { display: flex; align-items: center; gap: 10px; flex: 1; font-size: 14px; cursor: pointer; }
  label.audio input { width: 18px; height: 18px; accent-color: var(--purple); }
  label.audio small { display: block; color: var(--muted); font-size: 12px; }
  .btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
  .btn.primary { background: linear-gradient(135deg, #7C3AED, #8B5CF6 55%, #38BDF8 130%); border-color: transparent; color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .empty { color: var(--muted); padding: 30px; grid-column: 1 / -1; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>O que você quer transmitir?</h1>
    <p>Escolha uma tela inteira ou uma janela. Seus amigos na call vão ver ao vivo.</p>
  </header>
  <div class="tabs">
    <button id="tabScreen" class="sel">Telas</button>
    <button id="tabWindow">Janelas</button>
  </div>
  <div class="grid" id="grid"></div>
  <footer>
    <label class="audio" id="audioRow">
      <input type="checkbox" id="audio" checked>
      <span>Transmitir o som do computador
        <small>Se seus amigos ouvirem eco da própria voz, desmarque esta opção.</small></span>
    </label>
    <button class="btn" id="cancel">Cancelar</button>
    <button class="btn primary" id="go" disabled>Transmitir</button>
  </footer>
<script>
  let data = { sources: [] }, type = 'screen', selected = null;
  const grid = document.getElementById('grid');
  const go = document.getElementById('go');

  function render() {
    grid.replaceChildren();
    const list = data.sources.filter((s) => s.type === type);
    if (!list.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = type === 'screen' ? 'Nenhuma tela encontrada.' : 'Nenhuma janela aberta encontrada.';
      grid.append(e);
    }
    list.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'src' + (selected === s.id ? ' sel' : '');
      const t = document.createElement('div'); t.className = 'thumb';
      if (s.thumb) t.style.backgroundImage = 'url("' + s.thumb + '")'; else t.textContent = 'Sem prévia';
      const n = document.createElement('div'); n.className = 'name';
      if (s.icon) { const im = document.createElement('img'); im.src = s.icon; im.alt = ''; n.append(im); }
      const sp = document.createElement('span');
      sp.textContent = s.type === 'screen' ? (data.sources.filter((x) => x.type === 'screen').length > 1 ? 'Tela ' + (i + 1) : 'Tela inteira') : s.name;
      n.append(sp);
      b.append(t, n);
      b.onclick = () => { selected = s.id; go.disabled = false; render(); };
      b.ondblclick = () => { selected = s.id; send(); };
      grid.append(b);
    });
  }
  function setTab(t) {
    type = t;
    document.getElementById('tabScreen').classList.toggle('sel', t === 'screen');
    document.getElementById('tabWindow').classList.toggle('sel', t === 'window');
    render();
  }
  function send() { if (selected) window.picker.choose({ id: selected, audio: data.audioRequested && document.getElementById('audio').checked }); }

  document.getElementById('tabScreen').onclick = () => setTab('screen');
  document.getElementById('tabWindow').onclick = () => setTab('window');
  document.getElementById('cancel').onclick = () => window.picker.choose(null);
  go.onclick = send;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.choose(null); if (e.key === 'Enter') send(); });

  window.picker.onSources((d) => {
    data = d;
    document.getElementById('audioRow').style.display = d.audioRequested ? '' : 'none';
    const screens = d.sources.filter((s) => s.type === 'screen');
    if (screens.length === 1) { selected = screens[0].id; go.disabled = false; }
    render();
  });
  window.picker.ready();
</script>
</body>
</html>
